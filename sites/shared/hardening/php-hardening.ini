; NovaEdge PHP hardening — reduces information disclosure (§5).
; Deployed into the container at /usr/local/etc/php/conf.d/zz-hardening.ini

; Do not advertise PHP in response headers (removes X-Powered-By).
expose_php = Off

; Never render errors/stack traces to the public.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Reasonable limits for a small web app.
upload_max_filesize = 8M
post_max_size = 10M
max_execution_time = 30

; Session cookie hardening.
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
