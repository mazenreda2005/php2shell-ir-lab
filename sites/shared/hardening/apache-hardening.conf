# NovaEdge Apache hardening — reduces information disclosure (§5).
# Deployed into the container at /etc/apache2/conf-enabled/zz-hardening.conf

# Do not reveal Apache/PHP version in Server: header or on error pages.
ServerTokens Prod
ServerSignature Off

# Generic error pages (no internal detail leaked to the public).
ErrorDocument 403 "Forbidden"
ErrorDocument 404 "Not found"
ErrorDocument 500 "Service temporarily unavailable"

# Block access to sensitive files that must never be web-served.
<FilesMatch "(^\.|\.(ini|log|jsonl|sh|tftpl|pem|key|env)$)">
    Require all denied
</FilesMatch>

# Keep the private app data directory out of the web root entirely.
<Directory /var/www/private>
    Require all denied
</Directory>

# Security response headers (guarded so Apache starts even before mod_headers is enabled).
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By
</IfModule>
